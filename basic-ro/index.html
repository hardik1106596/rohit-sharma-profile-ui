<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Rohit Sharma Profile</title>

    <link rel="stylesheet"
    href="style.css">

</head>

<body>

    <!-- Main Container -->

    <div class="container">

        <!-- Hero Section -->

        <div class="hero">

            <img
                class="profile-img"
                src="images/rohit.jpg"
                alt="Rohit Sharma"
            >

            <h1>
                Rohit Sharma
            </h1>

            <p class="job">
                Indian Cricketer
            </p>

            <p class="bio">

                Rohit Sharma is one of
                India's greatest opening
                batsmen and captain.

            </p>

            <!-- Buttons -->

            <div class="buttons">

                <button class="follow-btn">

                    Follow

                </button>

                <button class="message-btn">

                    Message

                </button>

            </div>

        </div>

        <!-- Basic Info -->

        <div class="info-section">

            <div class="info-card">

                <h3>Role</h3>

                <p>Opening Batsman</p>

            </div>

            <div class="info-card">

                <h3>Batting Style</h3>

                <p>Right Handed</p>

            </div>

            <div class="info-card">

                <h3>Jersey No.</h3>

                <p>45</p>

            </div>

        </div>

        <!-- Records Section -->

        <div class="records">

            <h2>
                Records
            </h2>

            <ul>

                <li>
                    Highest ODI Score: 264
                </li>

                <li>
                    3 Double Centuries in ODI
                </li>

                <li>
                    5 IPL Titles as Captain
                </li>

            </ul>

        </div>

        <!-- Gallery -->

        <div class="gallery">

            <img src="images/gallery1.jpg">

            <img src="images/gallery2.jpg">

            <img src="images/gallery3.jpg">

        </div>

        <!-- Social Links -->

        <div class="social-links">

            <a href="#">
                Instagram
            </a>

            <a href="#">
                Twitter
            </a>

            <a href="#">
                YouTube
            </a>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
